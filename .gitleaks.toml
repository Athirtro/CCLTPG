title = "CCLTPG — escaneo de secretos"

[extend]
useDefault = true

[[allowlists]]
description = "Valores de ejemplo, documentación congelada y artefactos generados"
paths = [
  '''pnpm-lock\.yaml''',
  '''(^|/)\.env\.example$''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''^docs/''',
  '''^packages/contracts/(openapi|events)\.json$''',
  '''^apps/api/test/fixtures/''',
  '''^scripts/secret-scan\.test\.mjs$''',
]
regexes = [
  '''change[_-]?me''',
  '''local_only''',
  '''placeholder''',
  '''<[^>]+>''',
]

[[allowlists]]
description = "Token CSRF sintético del test en commits históricos"
commits = [
  "9e667375b86b754af9591f050de4a628f139ce94",
  "931e795d5633279d018198156b29938aa2961f13",
  "737df2ba77f77a01ceddd34723d93ae235d803d6",
  "0af303515395d45b53577cc2dff8638c7d85779d",
]
paths = ['''^apps/api/src/modules/identity/api/csrf\.service\.spec\.ts$''']
regexTarget = "secret"
regexes = ['''^0123456789abcdef0123456789abcdef$''']
condition = "AND"

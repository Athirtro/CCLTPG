title = "CCLTPG — escaneo de secretos"

[extend]
useDefault = true

[allowlist]
description = "Valores de ejemplo, documentación congelada y artefactos generados"
paths = [
  '''pnpm-lock\.yaml''',
  '''(^|/)\.env\.example$''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''^docs/''',
  '''^packages/contracts/(openapi|events)\.json$''',
  '''^apps/api/test/fixtures/''',
  '''^scripts/secret-scan\.test\.mjs$''',
]
regexes = [
  '''change[_-]?me''',
  '''local_only''',
  '''placeholder''',
  '''<[^>]+>''',
]

[[allowlists]]
description = "Token CSRF sintético del test en el commit anterior"
commits = ["9e667375b86b754af9591f050de4a628f139ce94"]
paths = ['''^apps/api/src/modules/identity/api/csrf\.service\.spec\.ts$''']
regexTarget = "secret"
regexes = ['''^0123456789abcdef0123456789abcdef$''']
condition = "AND"

openapi: 3.0.3
info:
  title: CCLTPG API v1 (Propuesta)
  version: 1.0.0-propuesta
  description: |
    Propuesta inicial de contrato API v1 — **pendiente de aprobación en Compuerta 0**.
    Fuente: propuesta formal del equipo (conversación) alineada con caps. 6.2, 8, 9, 10 y 11 de `docs/diseno-arquitectonico.md`.
    No es vinculante hasta aprobación explícita. Los esquemas de cuerpo/respuesta marcados como TODO deben completarse antes de implementación.

    Convenciones: prefijo `/api/v1`, rutas kebab-case, JSON camelCase, errores Problem Details (RFC 9457) con `code` y `requestId`,
    paginación `page`/`pageSize` (máx. 100), `Idempotency-Key` en creaciones con efectos secundarios.
    Endpoints de exportación y analítica se difieren a Compuerta 6.
servers:
  - url: /api/v1
    description: Prefijo de versión v1
tags:
  - name: auth
  - name: identity
  - name: academic
  - name: files
  - name: notifications
  - name: audit
  - name: me
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Inicio de sesión
      security: []
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado o MFA requerido (estado parcial)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /auth/mfa/verify:
    post:
      tags: [auth]
      summary: Verificación MFA
      description: Requiere sesión parcial previa de login.
      security: []
      operationId: authMfaVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Access token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotación de refresh token
      description: Usa cookie httpOnly; detecta reutilización y rota familia.
      security: []
      operationId: authRefresh
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [auth]
      summary: Cierre de sesión
      description: Revoca la familia de tokens. Operación idempotente.
      operationId: authLogout
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/Problem'
  /me:
    get:
      tags: [me]
      summary: Usuario autenticado, perfiles vigentes y permisos efectivos
      operationId: getMe
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /identity/users:
    get:
      tags: [identity]
      summary: Listar usuarios
      description: 'Permiso: identity:user:manage'
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [identity]
      summary: Crear usuario
      description: 'Permiso: identity:user:manage. Requiere Idempotency-Key.'
      operationId: createUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /identity/users/{id}:
    patch:
      tags: [identity]
      summary: Actualizar datos de usuario (no estado)
      description: 'Permiso: identity:user:manage. Los cambios de estado se realizan vía /transitions (R-005).'
      operationId: patchUser
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /identity/users/{id}/transitions:
    post:
      tags: [identity]
      summary: Transición de estado de usuario
      description: 'Permiso: identity:user:manage. Transiciones administrativas según cap. 9 (R-005). Bloqueos sistémicos no se exponen como acción directa del cliente.'
      operationId: transitionUser
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateTransitionRequest'
      responses:
        '200':
          description: Transición aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /identity/users/{id}/profiles:
    post:
      tags: [identity]
      summary: Asignar perfil a usuario
      description: 'Permiso: identity:user:manage. Requiere Idempotency-Key. Acepta validUntil.'
      operationId: assignUserProfile
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileAssignRequest'
      responses:
        '201':
          description: Perfil asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '403':
          $ref: '#/components/responses/Problem'
  /academic/programs:
    get:
      tags: [academic]
      summary: Listar programas formativos
      description: 'Permiso: academic:program:manage'
      operationId: listPrograms
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPrograms'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [academic]
      summary: Crear programa formativo
      description: 'Permiso: academic:program:manage. Requiere Idempotency-Key.'
      operationId: createProgram
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreateRequest'
      responses:
        '201':
          description: Programa creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '403':
          $ref: '#/components/responses/Problem'
  /academic/programs/{id}/transitions:
    post:
      tags: [academic]
      summary: Transición de estado de programa
      description: 'Permiso: academic:program:manage. Cuerpo: { "to": "publicado" | "archivado" }.'
      operationId: transitionProgram
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateTransitionRequest'
      responses:
        '200':
          description: Transición aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '409':
          $ref: '#/components/responses/Problem'
  /academic/groups:
    get:
      tags: [academic]
      summary: Listar grupos
      description: 'Permiso: academic:group:manage o academic:group:read_own (educador ve solo los suyos).'
      operationId: listGroups
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroups'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [academic]
      summary: Crear grupo
      description: 'Permiso: academic:group:manage. Requiere Idempotency-Key.'
      operationId: createGroup
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '201':
          description: Grupo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '403':
          $ref: '#/components/responses/Problem'
  /academic/groups/{id}/transitions:
    post:
      tags: [academic]
      summary: Transición de estado de grupo
      description: 'Permiso: academic:group:manage. abierto → cerrado.'
      operationId: transitionGroup
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateTransitionRequest'
      responses:
        '200':
          description: Transición aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '409':
          $ref: '#/components/responses/Problem'
  /academic/students:
    get:
      tags: [academic]
      summary: Listar estudiantes
      description: 'Permiso: academic:student:manage'
      operationId: listStudents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudents'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [academic]
      summary: Crear estudiante
      description: 'Permiso: academic:student:manage. Requiere Idempotency-Key y consentimiento_datos.'
      operationId: createStudent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
      responses:
        '201':
          description: Estudiante creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '403':
          $ref: '#/components/responses/Problem'
  /me/student:
    get:
      tags: [me, academic]
      summary: Datos propios del estudiante
      description: 'Permiso: academic:student:read_own'
      operationId: getMyStudent
      responses:
        '200':
          description: Perfil de estudiante propio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '403':
          $ref: '#/components/responses/Problem'
  /academic/enrollments:
    post:
      tags: [academic]
      summary: Crear matrícula
      description: 'Permiso: academic:enrollment:create. Requiere Idempotency-Key. Valida cupo y duplicados.'
      operationId: createEnrollment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreateRequest'
      responses:
        '201':
          description: Matrícula creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '409':
          $ref: '#/components/responses/Problem'
  /academic/enrollments/{id}/transitions:
    post:
      tags: [academic]
      summary: Transición de estado de matrícula
      description: 'Permiso: academic:enrollment:update. Valida cupo al confirmar según reglas de negocio.'
      operationId: transitionEnrollment
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateTransitionRequest'
      responses:
        '200':
          description: Transición aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '409':
          $ref: '#/components/responses/Problem'
  /me/enrollments:
    get:
      tags: [me, academic]
      summary: Matrículas propias
      description: 'Permiso: academic:enrollment:read_own'
      operationId: getMyEnrollments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnrollments'
        '403':
          $ref: '#/components/responses/Problem'
  /me/schedule:
    get:
      tags: [me, academic]
      summary: Horario propio
      description: 'Permiso: academic:schedule:read_own'
      operationId: getMySchedule
      responses:
        '200':
          description: Horario del estudiante/usuario según contexto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '403':
          $ref: '#/components/responses/Problem'
  /academic/sessions:
    post:
      tags: [academic]
      summary: Crear sesión de clase
      description: 'Permiso: academic:session:create. Requiere Idempotency-Key. Solo educador dueño del grupo (regla adicional).'
      operationId: createSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '403':
          $ref: '#/components/responses/Problem'
  /academic/sessions/{id}/transitions:
    post:
      tags: [academic]
      summary: Transición de estado de sesión
      description: 'Permiso: academic:session:update. programada → realizada | cancelada.'
      operationId: transitionSession
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateTransitionRequest'
      responses:
        '200':
          description: Transición aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '409':
          $ref: '#/components/responses/Problem'
  /academic/sessions/{id}/attendance:
    put:
      tags: [academic]
      summary: Registrar asistencia (masivo por matrícula)
      description: 'Permiso: academic:attendance:create. Idempotente por estado resultante: el cuerpo representa el registro completo de la sesión (R-010).'
      operationId: putAttendance
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceBulkRequest'
      responses:
        '200':
          description: Asistencia registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceBulkResponse'
        '403':
          $ref: '#/components/responses/Problem'
  /academic/evaluations:
    post:
      tags: [academic]
      summary: Crear evaluación cualitativa
      description: 'Permiso: academic:evaluation:create. Requiere Idempotency-Key. Única por matrícula, indicador y periodo.'
      operationId: createEvaluation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationCreateRequest'
      responses:
        '201':
          description: Evaluación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '409':
          $ref: '#/components/responses/Problem'
  /me/evaluations:
    get:
      tags: [me, academic]
      summary: Evaluaciones propias
      description: 'Permiso: academic:evaluation:read_own'
      operationId: getMyEvaluations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvaluations'
        '403':
          $ref: '#/components/responses/Problem'
  /files:
    post:
      tags: [files]
      summary: Cargar archivo
      description: 'Permiso: files:document:create. multipart/form-data, 10 MB, lista blanca de MIME. Requiere Idempotency-Key.'
      operationId: uploadFile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: Archivo cargado (metadatos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /files/{id}/download:
    get:
      tags: [files]
      summary: Descargar archivo
      description: 'Permiso: files:document:read o files:document:read_own. Siempre registra auditoría.'
      operationId: downloadFile
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Contenido del archivo
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /notifications:
    get:
      tags: [notifications]
      summary: Listar notificaciones propias
      description: 'Permiso: notifications:notification:read_own'
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotifications'
        '403':
          $ref: '#/components/responses/Problem'
  /notifications/{id}:
    patch:
      tags: [notifications]
      summary: Marcar notificación como leída
      description: 'Permiso: notifications:notification:read_own'
      operationId: patchNotification
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPatchRequest'
      responses:
        '200':
          description: Notificación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '403':
          $ref: '#/components/responses/Problem'
  /notifications/preferences:
    get:
      tags: [notifications]
      summary: Obtener preferencias de notificación
      description: 'Permiso: notifications:preference:update_own'
      operationId: getNotificationPreferences
      responses:
        '200':
          description: Preferencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '403':
          $ref: '#/components/responses/Problem'
    put:
      tags: [notifications]
      summary: Actualizar preferencias de notificación
      description: 'Permiso: notifications:preference:update_own. Notificaciones críticas no silenciables.'
      operationId: putNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesUpdateRequest'
      responses:
        '200':
          description: Preferencias actualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '403':
          $ref: '#/components/responses/Problem'
  /audit/events:
    get:
      tags: [audit]
      summary: Consultar eventos de auditoría
      description: 'Permiso: audit:event:read. Filtros por actor, recurso, acción y rango temporal.'
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: actorId
          schema: { type: string, format: uuid }
        - in: query
          name: recurso
          schema: { type: string }
        - in: query
          name: accion
          schema: { type: string }
        - in: query
          name: desde
          schema: { type: string, format: date-time }
        - in: query
          name: hasta
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Lista paginada de eventos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEvents'
        '403':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
      description: Obligatoria en creaciones con efectos secundarios.
  responses:
    Problem:
      description: Error en formato Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Código estable de error de dominio/aplicación.
          example: ENROLLMENT_CAPACITY_EXCEEDED
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        requestId: { type: string }
    PaginationMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    StateTransitionRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          description: Estado destino permitido por la máquina de estados.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      description: TODO completar contrato de sesión parcial/MFA según decisión de C2.
      properties:
        mfaRequired: { type: boolean }
        sessionToken: { type: string, nullable: true }
    MfaVerifyRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
        sessionToken: { type: string }
    TokenResponse:
      type: object
      description: Access token en cuerpo; refresh en cookie httpOnly según diseño.
      properties:
        accessToken: { type: string }
